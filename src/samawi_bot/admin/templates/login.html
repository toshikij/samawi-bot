{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px;margin:60px auto">
<h1>Sign in</h1>
{% if sent %}<p>If this dashboard has an owner address, a sign-in link is on its way. It works for 15 minutes.</p>
{% else %}<p class="muted">A one-time link is emailed to the owner address. Nothing to type.</p>
<form method="post" action="{{ base }}/login"><button>Email me a sign-in link</button></form>{% endif %}
</div>{% endblock %}
